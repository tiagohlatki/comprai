name: comprai
description: Comparador inteligente de preços via NFC-e
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  # ── Supabase ────────────────────────────────────────────────
  supabase_flutter: ^2.9.0

  # ── Navegação ───────────────────────────────────────────────
  go_router: ^14.8.1

  # ── Gerenciamento de estado ──────────────────────────────────
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7

  # ── Injeção de dependência ───────────────────────────────────
  get_it: ^8.0.3
  injectable: ^2.5.0

  # ── Scanner QR Code / NFC-e ──────────────────────────────────
  mobile_scanner: ^7.0.1

  # ── Geolocalização e mapas ───────────────────────────────────
  geolocator: ^13.0.4
  google_maps_flutter: ^2.12.1

  # ── Utilitários ──────────────────────────────────────────────
  dartz: ^0.10.1
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  mocktail: ^1.0.4

  # ── Code generation ──────────────────────────────────────────
  build_runner: ^2.4.15
  freezed: ^2.5.7
  json_serializable: ^6.9.5
  injectable_generator: ^2.7.0

flutter:
  uses-material-design: true
