name: Backend Functions

on:
  push:
    paths:
      - 'backend/functions/**'
      - '.github/workflows/backend.yml'
  pull_request:
    paths:
      - 'backend/functions/**'

jobs:
  quality:
    name: Quality & Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        function: [normalize-product, suggest-markets, parse-nfce]

    defaults:
      run:
        working-directory: backend/functions/${{ matrix.function }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test -- --passWithNoTests

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start Supabase local
        run: supabase start
        working-directory: backend

      - name: Run integration tests
        run: npm run test:integration --workspaces --if-present
        working-directory: backend/functions

      - name: Stop Supabase
        run: supabase stop
        working-directory: backend
        if: always()
