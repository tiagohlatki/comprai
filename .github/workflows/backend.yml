name: Backend Functions

on:
  push:
    paths:
      - 'backend/functions/**'
      - 'backend/supabase/functions/**'
      - '.github/workflows/backend.yml'
  pull_request:
    paths:
      - 'backend/functions/**'
      - 'backend/supabase/functions/**'

jobs:
  # ──────────────────────────────────────────────────────────────
  # Node.js functions (backend/functions/*)
  # ──────────────────────────────────────────────────────────────
  quality:
    name: Quality & Tests (Node)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        function: [normalize-product, suggest-markets, parse-nfce]

    defaults:
      run:
        working-directory: backend/functions/${{ matrix.function }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Type check
        run: |
          if [ -f tsconfig.json ]; then npx tsc --noEmit; else echo "No tsconfig.json, skipping"; fi

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test -- --passWithNoTests

  # ──────────────────────────────────────────────────────────────
  # Deno Edge Functions (backend/supabase/functions/*)
  # ──────────────────────────────────────────────────────────────
  deno-quality:
    name: Quality (Deno Edge Functions)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Check consultar-nfce
        run: deno check backend/supabase/functions/consultar-nfce/index.ts

      - name: Lint consultar-nfce
        run: deno lint backend/supabase/functions/consultar-nfce/index.ts

      - name: Format check
        run: deno fmt --check backend/supabase/functions/

  # ──────────────────────────────────────────────────────────────
  # Integration tests (Node + Supabase local)
  # ──────────────────────────────────────────────────────────────
  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [quality, deno-quality]

    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start Supabase local
        run: supabase start
        working-directory: backend

      - name: Run integration tests
        run: npm run test:integration --workspaces --if-present
        working-directory: backend/functions

      - name: Stop Supabase
        run: supabase stop
        working-directory: backend
        if: always()
